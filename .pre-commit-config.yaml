default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.2
    hooks:
      - id: uv-sync

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Byte-precise unicode-hygiene fixtures must not be whitespace-normalised
        # (e.g. stripping a trailing U+202C), or the test suite breaks.
        exclude: ^tests/fixtures/unicode-hygiene/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/unicode-hygiene/
      - id: check-yaml
      - id: check-added-large-files
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: check-executables-have-shebangs
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.0.166 # Use the latest release tag
    hooks:
      - id: rumdl
        # Only lint user-facing documentation (matches .rumdl.toml include patterns)
        files: ^(README\.md|plugins/[^/]+/README\.md|plugins/[^/]+/[^/]+/README\.md|docs/(architecture|checklists)/[^/]+\.md)$

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 42.19.3
    hooks:
      - id: renovate-config-validator
        args: [--strict]

  - repo: local
    hooks:
      - id: validate-unicode-hygiene
        name: Unicode hygiene gate
        entry: uv run scripts/validate-unicode-hygiene.py
        language: system
        pass_filenames: true
        files: ^(plugins/.+/(SKILL\.md|agents/.+\.md|commands/.+\.md)|plugins/.+/\.claude-plugin/plugin\.json|\.claude-plugin/marketplace\.json|\.claude/skills/.+/SKILL\.md|\.claude/commands/.+\.md)$
