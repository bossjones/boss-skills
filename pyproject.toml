[project]
name = "boss-skills"
version = "0.1.0"
description = "Boss Skills Repo and Lab for my personal Claude Code configs and skills"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Malcolm Jones", email = "bossjones@theblacktonystark.com" },
]
readme = "README.md"
license = "MIT"
dependencies = [
    "jsonschema>=4.20.0",
    "rich>=13.0.0",
    "firecrawl-py>=1.0.0",
    "claude-agent-sdk>=0.1.6",
    "pyyaml>=6.0",
    "funlog>=0.2.1",
    "pillow>=12.1.0",
    "numpy>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "basedpyright>=1.29.1",
    "rumdl>=0.0.208",
    "pytest-sugar>=1.1.1",
    "codespell>=2.4.1",
    "pytest-mock>=3.15.1",
    "pytest-recording>=0.13.4",
    "pytest-retry>=1.7.0",
    "pytest-skip-slow>=0.0.5",
    "pytest-skipuntil>=0.2.0",
    "pytest-subprocess>=1.5.3",
    "pytest-timeout>=2.4.0",
    "monkeytype>=23.3.0",
    "ty>=0.0.8",
]

[tool.uv]
package = false

[tool.ty.environment]
python = "./.venv"
python-version = "3.10"

[tool.ty.src]
exclude = [".claude/"]

[tool.ty.rules]
unresolved-import = "ignore"


[tool.ruff]
target-version = "py310"
line-length = 120
fix = true
exclude = [".claude/"]

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E",
    "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"**/tests/**" = ["S101", "S108"]
"plugins/boss-dev/agent-harness/**" = [
    "S",      # security rules (subprocess, try/pass, random) — vendored hooks
    "SIM",    # simplify — stylistic, refine after scaffolding stabilizes
    "TRY",    # tryceratops — exception-handling patterns differ in vendored hooks
    "C901",   # function complexity — scaffolding code
    "F841",   # unused locals — scaffolding placeholders
    "B",      # flake8-bugbear — refine after scaffolding stabilizes
    "UP",     # pyupgrade — refine after scaffolding stabilizes
    "RUF",    # ruff-specific — refine after scaffolding stabilizes
    "E402",   # module-level imports — sys.path tweaks in scripts
    "W291",   # trailing whitespace — defer to scaffolding cleanup
    "W293",   # whitespace on blank line — defer to scaffolding cleanup
]
"plugins/social-media/twitter-tools/**" = [
    "S",      # subprocess/assert — playwright + gallery-dl scripts
    "SIM",    # simplify — stylistic
    "TRY",    # tryceratops — exception-handling patterns differ
    "C901",   # function complexity
    "RUF",    # ruff-specific (unused unpack in tests, etc.)
    "E402",   # module-level imports — sys.path tweaks before imports
    "W291",   # trailing whitespace
    "W293",   # whitespace on blank line
]

[tool.ruff.format]
preview = true

[tool.basedpyright]
# devtools/lint.py invokes basedpyright on a curated path list (not the full
# plugins/ tree). Both currently-scaffolding plugins are excluded; re-add them
# here and to the lint.py path list when they exit scaffolding.
exclude = [
    ".claude/",
    "plugins/boss-dev/agent-harness/",
    "plugins/social-media/twitter-tools/",
]
