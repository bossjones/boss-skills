<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1536" height="640" fill="#FAFAF7"/>
  <!-- horizon line -->
  <line x1="0" y1="250" x2="1536" y2="250" stroke="#E3E6E0" stroke-width="2.5"/>
  <circle cx="1300" cy="150" r="52" fill="none" stroke="#B57614" stroke-width="3" opacity="0.55"/>
  <!-- road: solid lit segment (MVP) then fading -->
  <path d="M 618 640 L 768 250 L 918 640 Z" fill="#E3F2F1"/>
  <path d="M 638 640 L 768 260 L 898 640" fill="none" stroke="#0E7C7B" stroke-width="7" stroke-linecap="round"/>
  <!-- center dashes: solid near, fading far -->
  <g stroke="#0E7C7B" stroke-linecap="round">
    <line x1="768" y1="610" x2="768" y2="560" stroke-width="9"/>
    <line x1="768" y1="520" x2="768" y2="482" stroke-width="7"/>
    <line x1="768" y1="448" x2="768" y2="420" stroke-width="6" opacity="0.8"/>
    <line x1="768" y1="392" x2="768" y2="372" stroke-width="5" opacity="0.6"/>
    <line x1="768" y1="348" x2="768" y2="334" stroke-width="4" opacity="0.4"/>
    <line x1="768" y1="314" x2="768" y2="304" stroke-width="3" opacity="0.25"/>
  </g>
  <!-- MVP label on the lit road -->
  <rect x="694" y="530" width="148" height="56" rx="12" fill="#0E7C7B"/>
  <text x="768" y="568" font-size="30" font-weight="700" text-anchor="middle" fill="#FAFAF7">MVP</text>
  <!-- distant milestone markers -->
  <g font-size="20" fill="#4A5A6A">
    <g opacity="0.6">
      <line x1="420" y1="250" x2="420" y2="196" stroke="#4A5A6A" stroke-width="3.5"/>
      <circle cx="420" cy="186" r="9" fill="#4A5A6A"/>
      <text x="420" y="290" text-anchor="middle">multi-agent</text>
    </g>
    <g opacity="0.45">
      <line x1="1010" y1="250" x2="1010" y2="206" stroke="#4A5A6A" stroke-width="3"/>
      <circle cx="1010" cy="197" r="8" fill="#4A5A6A"/>
      <text x="1010" y="290" text-anchor="middle">LLM judging</text>
    </g>
    <g opacity="0.35">
      <line x1="1220" y1="250" x2="1220" y2="214" stroke="#4A5A6A" stroke-width="2.5"/>
      <circle cx="1220" cy="206" r="7" fill="#4A5A6A"/>
      <text x="1220" y="290" text-anchor="middle">budgets</text>
    </g>
  </g>
</svg>
