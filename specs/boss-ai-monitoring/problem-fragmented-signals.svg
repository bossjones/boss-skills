<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1536" height="640" fill="#FAFAF7"/>
  <!-- silo 1: OTel -->
  <g>
    <path d="M 120 180 a 90 30 0 0 1 180 0 v 240 a 90 30 0 0 1 -180 0 z" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="2.5"/>
    <ellipse cx="210" cy="180" rx="90" ry="30" fill="#E3F2F1" stroke="#0E7C7B" stroke-width="2.5"/>
    <text x="210" y="330" font-size="26" font-weight="600" text-anchor="middle" fill="#1C2733">OTel</text>
  </g>
  <!-- silo 2: JSONL -->
  <g>
    <path d="M 420 180 a 90 30 0 0 1 180 0 v 240 a 90 30 0 0 1 -180 0 z" fill="#FFFFFF" stroke="#B57614" stroke-width="2.5"/>
    <ellipse cx="510" cy="180" rx="90" ry="30" fill="#FAF1DE" stroke="#B57614" stroke-width="2.5"/>
    <text x="510" y="330" font-size="26" font-weight="600" text-anchor="middle" fill="#1C2733">JSONL</text>
  </g>
  <!-- silo 3: LangSmith -->
  <g>
    <path d="M 720 180 a 90 30 0 0 1 180 0 v 240 a 90 30 0 0 1 -180 0 z" fill="#FFFFFF" stroke="#3A6EA5" stroke-width="2.5"/>
    <ellipse cx="810" cy="180" rx="90" ry="30" fill="#E7EEF7" stroke="#3A6EA5" stroke-width="2.5"/>
    <text x="810" y="330" font-size="26" font-weight="600" text-anchor="middle" fill="#1C2733">LangSmith</text>
  </g>
  <!-- dashed broken connections -->
  <g stroke="#C0504D" stroke-width="3" stroke-dasharray="10 12" fill="none" opacity="0.8">
    <path d="M 310 300 L 410 300"/>
    <path d="M 610 300 L 710 300"/>
    <path d="M 910 300 L 1040 300"/>
  </g>
  <!-- dimmed empty dashboard -->
  <g opacity="0.45">
    <rect x="1060" y="150" width="380" height="300" rx="14" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="2.5" stroke-dasharray="14 10"/>
    <rect x="1060" y="150" width="380" height="42" rx="14" fill="#4A5A6A" opacity="0.35"/>
  </g>
  <text x="1250" y="345" font-size="110" font-weight="700" text-anchor="middle" fill="#4A5A6A" opacity="0.6">?</text>
  <text x="1250" y="500" font-size="24" text-anchor="middle" fill="#4A5A6A">no unified view</text>
</svg>
