<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1536" height="640" fill="#FAFAF7"/>
  <!-- three source streams -->
  <g font-size="26" font-weight="600">
    <rect x="70" y="110" width="200" height="64" rx="10" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="2"/>
    <text x="170" y="150" text-anchor="middle" fill="#1C2733">OTel</text>
    <rect x="70" y="288" width="200" height="64" rx="10" fill="#FFFFFF" stroke="#B57614" stroke-width="2"/>
    <text x="170" y="328" text-anchor="middle" fill="#1C2733">JSONL</text>
    <rect x="70" y="466" width="200" height="64" rx="10" fill="#FFFFFF" stroke="#3A6EA5" stroke-width="2"/>
    <text x="170" y="506" text-anchor="middle" fill="#1C2733">LangSmith</text>
  </g>
  <!-- converging streams -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M 270 142 C 480 142, 520 300, 700 316" stroke="#0E7C7B"/>
    <path d="M 270 320 C 460 320, 520 320, 700 320" stroke="#B57614"/>
    <path d="M 270 498 C 480 498, 520 340, 700 324" stroke="#3A6EA5"/>
  </g>
  <!-- browser dashboard window -->
  <g>
    <rect x="700" y="96" width="736" height="448" rx="14" fill="#FFFFFF" stroke="#1C2733" stroke-width="2.5"/>
    <rect x="700" y="96" width="736" height="46" rx="14" fill="#1C2733"/>
    <rect x="700" y="120" width="736" height="22" fill="#1C2733"/>
    <circle cx="730" cy="119" r="7" fill="#C0504D"/>
    <circle cx="756" cy="119" r="7" fill="#B57614"/>
    <circle cx="782" cy="119" r="7" fill="#0E7C7B"/>
    <!-- stat tiles -->
    <rect x="732" y="172" width="212" height="88" rx="8" fill="#FAF1DE"/>
    <text x="752" y="207" font-size="20" fill="#4A5A6A">cost</text>
    <text x="752" y="242" font-size="30" font-weight="700" fill="#B57614">$4.21</text>
    <rect x="962" y="172" width="212" height="88" rx="8" fill="#E3F2F1"/>
    <text x="982" y="207" font-size="20" fill="#4A5A6A">tokens</text>
    <text x="982" y="242" font-size="30" font-weight="700" fill="#0E7C7B">1.2M</text>
    <rect x="1192" y="172" width="212" height="88" rx="8" fill="#E7EEF7"/>
    <text x="1212" y="207" font-size="20" fill="#4A5A6A">sessions</text>
    <text x="1212" y="242" font-size="30" font-weight="700" fill="#3A6EA5">7</text>
    <!-- task duration bars -->
    <g fill="#0E7C7B">
      <rect x="732" y="300" width="420" height="26" rx="6" opacity="0.9"/>
      <rect x="732" y="340" width="300" height="26" rx="6" opacity="0.7"/>
      <rect x="732" y="380" width="520" height="26" rx="6" opacity="0.8"/>
      <rect x="732" y="420" width="220" height="26" rx="6" opacity="0.6"/>
      <rect x="732" y="460" width="360" height="26" rx="6" opacity="0.75"/>
    </g>
    <text x="732" y="530" font-size="20" fill="#4A5A6A">time per task</text>
    <!-- live dot -->
    <circle cx="1380" cy="330" r="12" fill="#0E7C7B"/>
    <circle cx="1380" cy="330" r="22" fill="none" stroke="#0E7C7B" stroke-width="2" opacity="0.4"/>
    <circle cx="1380" cy="330" r="32" fill="none" stroke="#0E7C7B" stroke-width="1.5" opacity="0.2"/>
    <text x="1380" y="386" font-size="20" text-anchor="middle" fill="#4A5A6A">live</text>
  </g>
</svg>
