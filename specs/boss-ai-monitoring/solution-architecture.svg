<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1536" height="640" fill="#FAFAF7"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1C2733"/>
    </marker>
  </defs>
  <!-- inputs -->
  <g font-size="24" font-weight="600">
    <rect x="60" y="120" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="2"/>
    <text x="155" y="158" text-anchor="middle" fill="#1C2733">OTel :4318</text>
    <rect x="60" y="290" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#B57614" stroke-width="2"/>
    <text x="155" y="328" text-anchor="middle" fill="#1C2733">JSONL</text>
    <rect x="60" y="460" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#3A6EA5" stroke-width="2"/>
    <text x="155" y="498" text-anchor="middle" fill="#1C2733">LangSmith</text>
  </g>
  <!-- streams into duckdb -->
  <g fill="none" stroke-width="3.5" stroke-linecap="round">
    <path d="M 250 150 C 400 150, 430 290, 555 306" stroke="#0E7C7B"/>
    <path d="M 250 320 C 380 320, 430 320, 555 320" stroke="#B57614"/>
    <path d="M 250 490 C 400 490, 430 350, 555 334" stroke="#3A6EA5"/>
  </g>
  <!-- duckdb cylinder -->
  <g>
    <path d="M 570 240 a 110 34 0 0 1 220 0 v 160 a 110 34 0 0 1 -220 0 z" fill="#FFFFFF" stroke="#1C2733" stroke-width="2.5"/>
    <ellipse cx="680" cy="240" rx="110" ry="34" fill="#E3F2F1" stroke="#1C2733" stroke-width="2.5"/>
    <text x="680" y="345" font-size="28" font-weight="700" text-anchor="middle" fill="#1C2733">DuckDB</text>
    <text x="680" y="378" font-size="19" text-anchor="middle" fill="#4A5A6A">one file</text>
  </g>
  <!-- arrow to dashboard -->
  <path d="M 800 320 L 930 320" fill="none" stroke="#1C2733" stroke-width="3.5" marker-end="url(#arr)"/>
  <!-- dashboard -->
  <g>
    <rect x="950" y="150" width="480" height="340" rx="14" fill="#FFFFFF" stroke="#1C2733" stroke-width="2.5"/>
    <rect x="950" y="150" width="480" height="42" rx="14" fill="#1C2733"/>
    <rect x="950" y="172" width="480" height="20" fill="#1C2733"/>
    <circle cx="978" cy="171" r="6" fill="#C0504D"/>
    <circle cx="1000" cy="171" r="6" fill="#B57614"/>
    <circle cx="1022" cy="171" r="6" fill="#0E7C7B"/>
    <rect x="978" y="218" width="130" height="60" rx="8" fill="#FAF1DE"/>
    <rect x="1124" y="218" width="130" height="60" rx="8" fill="#E3F2F1"/>
    <rect x="1270" y="218" width="130" height="60" rx="8" fill="#E7EEF7"/>
    <g fill="#0E7C7B">
      <rect x="978" y="308" width="300" height="20" rx="5" opacity="0.85"/>
      <rect x="978" y="340" width="220" height="20" rx="5" opacity="0.65"/>
      <rect x="978" y="372" width="380" height="20" rx="5" opacity="0.75"/>
    </g>
    <circle cx="1390" cy="330" r="9" fill="#0E7C7B"/>
    <circle cx="1390" cy="330" r="17" fill="none" stroke="#0E7C7B" stroke-width="1.8" opacity="0.4"/>
    <text x="1190" y="452" font-size="23" text-anchor="middle" fill="#4A5A6A">SSE dashboard</text>
  </g>
  <!-- marimo satellite -->
  <g>
    <path d="M 680 434 C 680 520, 830 560, 950 560" fill="none" stroke="#4A5A6A" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arr)"/>
    <rect x="960" y="530" width="200" height="62" rx="10" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="2"/>
    <text x="1060" y="568" font-size="22" font-weight="600" text-anchor="middle" fill="#4A5A6A">marimo</text>
  </g>
</svg>
