name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Cancel an in-flight review when a new commit is pushed to the same PR —
# the superseded run is wasted API spend and runner time.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required so the reviewer can post review/inline comments
      issues: read
      actions: read # let the reviewer read CI results on the PR
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Required because this repo's .claude/settings.json wires every
      # lifecycle hook to `uv run ...`; without uv the hooks fail with
      # "uv: not found". Mirrors the uv setup in ci.yml.
      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.15"
          enable-cache: true
          python-version: "3.13"

      - name: Set up Python (using uv)
        run: uv python install

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is required: without it the plugin runs the review but
          # posts nothing (see code-review.md step 7).
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # Pin the review model. claude_args is the docs-recommended way to set
          # the model and takes precedence over `settings`.
          # To switch models, comment out the active claude_args line below and
          # uncomment the other (keep exactly one active):
          claude_args: '--model claude-sonnet-4-6' # Sonnet 4.6 — faster, cheaper
          # claude_args: '--model claude-opus-4-8'   # Opus 4.8 — stronger reasoning
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

